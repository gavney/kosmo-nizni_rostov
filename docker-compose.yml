services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    mem_limit: 3072m
    cpus: "3.0"
    environment:
      SIM_SLOTS: "1"
      SIM_WAIT_S: "50"
      MAX_CACHED_SIMS: "6"
      MAX_FRAME_CACHE: "48"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
